spring:
  application:
    name: gateway-server
  profiles:
    active: local

server:
  port: 48080

# 日志文件配置
logging:
  file:
    name: ${user.home}/log/${spring.application.name}.log # 日志文件名，全路径
  level:
    com.zp.gmall: debug
    org.springframework: debug

gmall:
  logging:
    loki:
      # 本机 Loki 推送地址。校验方式：curl http://127.0.0.1:31920/ready 应返回 200
      url: http://127.0.0.1:31920/loki/api/v1/push
      # LOKI = 开启推送；LOKI_NOP = 关闭推送。
      # Loki 没启动时务必切成 LOKI_NOP：启动瞬间推送失败会被 LogbackLoggingSystem
      # 判定为“配置错误”并中断启动（运行期推送失败不会致命）
      appender: LOKI_NOP

---
spring:
  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。
  cloud:
    # Spring Cloud Gateway 配置项，对应 GatewayProperties 类
    gateway:
      discovery:
        locator:
          enabled: true #开启从注册中心动态创建路由的功能，利用微服务名进行路由
      # 路由配置项，对应 RouteDefinition 数数组
      routes:
         # system-server 服务
        - id: system-admin-api # 路由的编号
          uri: grayLb://system-server
          predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
            - Path=/system/**
          filters:
            - RewritePath=/system/admin-api/v3/api-docs, /system/v3/api-docs # 配置，保证转发到 /v3/api-docs
        - id: system-app-api # 路由的编号
          uri: grayLb://system-server
          predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
            - Path=/system/**
          filters:
            - RewritePath=/system/app-api/v3/api-docs, /system/v3/api-docs
        # ====== ai-server 服务 ======
        - id: ai-admin-api
          uri: grayLb://ai-server
          predicates:
            - Path=/admin-api/ai/**
          filters:
            - RewritePath=/admin-api/ai/v3/api-docs, /ai/v3/api-docs

        - id: ai-app-api
          uri: grayLb://ai-server
          predicates:
            - Path=/app-api/ai/**
          filters:
            - RewritePath=/app-api/ai/v3/api-docs, /ai/v3/api-docs

        ## infra-server 服务
        - id: infra-admin-api # 路由的编号
          uri: grayLb://infra-server
          predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
            - Path=/infra/**
          filters:
            - RewritePath=/infra/admin-api/v3/api-docs, /infra/v3/api-docs
        - id: infra-app-api # 路由的编号
          uri: grayLb://infra-server
          predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
            - Path=/infra/**
          filters:
            - RewritePath=/infra/app-api/v3/api-docs, /infra/v3/api-docs
        - id: infra-spring-boot-admin # 路由的编号（Spring Boot Admin）
          uri: grayLb://infra-server
          predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
            - Path=/admin/**
        - id: infra-websocket # 路由的编号（WebSocket）
          uri: grayLb://infra-server
          predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
            - Path=/infra/ws/**


      x-forwarded:
        prefix-enabled: false # 避免 Swagger 重复带上额外的 /admin-api/system 前缀

# ====== 新增：SpringDoc 聚合配置 ======
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
    urls:
      - name: system-server
        url: /system/admin-api/v3/api-docs
      - name: ai-server
        url: /ai/admin-api/v3/api-docs

--- #################### 注册中心相关配置 ####################
spring:
  cloud:
    nacos:
      server-addr: ${nacos.server.address:127.0.0.1:30848}
      username: nacos
      password: nacos
      discovery:
        group: gmall # 命名空间。这里使用 gmall 开发环境
        namespace: gmall
        metadata:
          version: 1.0.0 # 服务实例的版本号，可用于灰度发布

      # Nacos Config 配置项，对应 NacosConfigProperties 配置属性类
      config:
        file-extension: yaml
        group: gmall
        namespace: gmall

  config:
    import:
      - optional:nacos:gateway-server.yaml?group=gmall&refreshEnabled=true
