spring:
  ai:
    dashscope:
      api-key: sssss #${DASHSCOPE_API_KEY}
      #      base-url: @ai.dashscope.base-url@
      chat:
        options:
          model: qwen3.5-plus
          temperature: 0.7
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3.5:4b
          temperature: 0.7


--- #################### 数据库相关配置 ####################
spring:
  # 数据源配置项
  datasource:
    druid:
      web-stat-filter:
        enabled: true
        stat-view-servlet:
          enabled: true
          allow: # 设置白名单，不填则允许所有访问
          url-pattern: /druid/*
          login-username: # 控制台管理用户名和密码
          login-password:
        filter:
          stat:
            enabled: true
            log-slow-sql: true # 慢 SQL 记录
            slow-sql-millis: 100
            merge-sql: true
          wall:
            config:
              multi-statement-allow: true

    dynamic: # 多数据源配置
      druid: # Druid 【连接池】相关的全局配置
        initial-size: 1 # 初始连接数
        min-idle: 1 # 最小连接池数量
        max-active: 20 # 最大连接池数量
        max-wait: 600000 # 配置获取连接等待超时的时间，单位：毫秒
        time-between-eviction-runs-millis: 60000 # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒
        min-evictable-idle-time-millis: 300000 # 配置一个连接在池中最小生存的时间，单位：毫秒
        max-evictable-idle-time-millis: 900000 # 配置一个连接在池中最大生存的时间，单位：毫秒
        validation-query: SELECT 1 FROM DUAL # 配置检测连接是否有效
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
      primary: master
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:30306/gmall_ai?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&createDatabaseIfNotExist=true
          username: root
          password: root
        slave: # 模拟从库，可根据自己需要修改
          lazy: true # 开启懒加载，保证启动速度
          url: jdbc:mysql://127.0.0.1:30306/gmall_ai?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&createDatabaseIfNotExist=true
          username: root
          password: root

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis 配置。Redisson 默认的配置足够使用，一般不需要进行调优
  data:
    redis:
      host: 127.0.0.1 # 地址
      port: 30379 # 端口
      database: 0 # 数据库索引
      password: redis123456 # 密码，建议生产环境开启

--- #################### gmall相关配置 ####################
gmall:
  web:
    admin-ui:
      url: http://dashboard.gmall.cn

# 等价于原先 bootstrap 模式默认加载的 {spring.application.name}-{profile}.yaml
spring:
  config:
    import:
      - optional:nacos:ai-server-local.yaml?group=gmall&refreshEnabled=true

--- #################### 控制台彩色输出 ####################
# Boot 默认是 detect：IDEA 的 Run 控制台不是 TTY，会被判定为不支持 ANSI，%clr 就不上色。
# 本地开发强制开启；部署到容器/生产时不要设（或者用 detect），否则日志里会混入 ANSI 转义序列
spring:
  output:
    ansi:
      enabled: always

--- #################### 日志推送（Loki）配置 ####################
# 移除 spring-cloud-starter-bootstrap 后不再需要放 bootstrap-local.yml，
# Logback 初始化晚于 application-*.yml 的加载，springProperty 能正常取到值
gmall:
  logging:
    loki:
      # 本机 Loki 推送地址。校验方式：curl http://127.0.0.1:31920/ready 应返回 200
      # 30310 端口虽然也监听，但返回 302（网关重定向），推过去必然失败
      url: http://127.0.0.1:31920/loki/api/v1/push
      # LOKI = 开启推送；LOKI_NOP = 关闭推送。
      # Loki 没启动时务必切成 LOKI_NOP：启动瞬间推送失败会被 LogbackLoggingSystem
      # 判定为”配置错误“并中断启动（运行期推送失败不会致命）
      appender: LOKI
