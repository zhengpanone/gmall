--- #注册中心相关配置
spring:
  cloud:
    nacos:
      server-addr: ${nacos.server.address:127.0.0.1:30848}
      username: nacos
      password: nacos
      discovery:
        group: gmall
        namespace: gmall
        metadata:
          version: 1.0.0 # 服务实例的版本号，可用于灰度发布

      # Nacos Config 配置项，对应 NacosConfigProperties 配置属性类
      config:
        group: gmall
        namespace: gmall
        file-extension: yaml

--- #################### 日志推送（Loki）配置 ####################
# 必须放在 bootstrap-* 里：本项目启用了 spring-cloud-starter-bootstrap，
# Logback 在 bootstrap 阶段就完成初始化，放在 application-local.yml 时 springProperty 取不到值
gmall:
  logging:
    loki:
      # 本机 Loki 推送地址。校验方式：curl http://127.0.0.1:31920/ready 应返回 200
      # 30310 端口虽然也监听，但返回 302（网关重定向），推过去必然失败
      url: http://127.0.0.1:31920/loki/api/v1/push
      # LOKI = 开启推送；LOKI_NOP = 关闭推送。Loki 没启动时要改回 LOKI_NOP，否则应用会启动失败
      appender: LOKI