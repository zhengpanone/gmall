--- #################### 应用基础配置 ####################
spring:
  application:
    name: system-server
  profiles:
    active: local
   # Jackson配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置LocalDateTime格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用nanoseconds。例如说 1611460870.401，而是直接 1611460870401
      write-durations-as-timestamps: true # 设置Duration的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的Bean

server:
  port: 48082
  servlet:
    context-path: /system

# 日志文件配置。注意，如果 logging.file.name 不放在 bootstrap.yaml 配置文件，而是放在 application.yaml 中，会导致出现 LOG_FILE_IS_UNDEFINED 文件
logging:
  file:
    name: ${user.home}/log/${spring.application.name}.log # 日志文件名，全路径
  level:
    #    org.springframework: debug
    web: debug
    #    root: debug
    com.zp.gmall: debug

--- #注册中心相关配置
spring:
  cloud:
    nacos:
      server-addr: ${nacos.server.address:127.0.0.1:30848}
      username: nacos
      password: nacos
      discovery:
        group: gmall
        namespace: gmall
        metadata:
          version: 1.0.0 # 服务实例的版本号，可用于灰度发布

      # Nacos Config 配置项，对应 NacosConfigProperties 配置属性类
      config:
        group: gmall
        namespace: gmall
        file-extension: yaml
  config:
    import:
      - optional:nacos:system-server.yaml?group=gmall&refreshEnabled=true


--- #################### 验证码相关配置 ####################

aj:
  captcha:
#    jigsaw: classpath:images/jigsaw # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
#    pic-click: classpath:images/pic-click # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
    cache-type: redis # 缓存 local/redis...
    cache-number: 1000 # local 缓存的阈值,达到这个值，清除缓存
    timing-clear: 180 # local定时清除过期缓存(单位秒),设置为0代表不执行
    type: blockPuzzle # 验证码类型 default两种都实例化。 blockPuzzle 滑块拼图 clickWord 文字点选
    water-mark: gmall # 右下角水印文字(我的水印)，可使用 https://tool.chinaz.com/tools/unicode.aspx 中文转 Unicode，Linux 可能需要转 unicode
    interference-options: 0 # 滑动干扰项(0/1/2)
    req-frequency-limit-enable: false # 接口请求次数一分钟限制是否开启 true|false
    req-get-lock-limit: 5 # 验证失败5次，get接口锁定
    req-get-lock-seconds: 10 # 验证失败后，锁定时间间隔
    req-get-minute-limit: 30 # get 接口一分钟内请求数限制
    req-check-minute-limit: 60 # check 接口一分钟内请求数限制
    req-verify-minute-limit: 60 # verify 接口一分钟内请求数限制


--- #################### 接口文档配置 ####################
springdoc:
  api-docs:
    enabled: true # 1. 是否开启 Swagger 接文档的元数据
    path: /v3/api-docs
  swagger-ui:
    enabled: true # 2.1 是否开启 Swagger 文档的官方 UI 界面
    path: /swagger-ui/index.html
  default-flat-param-object: true # 参见 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param 文档


--- #################### 芋道相关配置 ####################
gmall:
  info:
    version: 0.0.1
  web:
    admin-ui:
      url: http://127.0.0.1:8080
  swagger:
    author: zhengpanone
    title: 管理后台
    description: 提供管理员管理的所有功能
    version: 1.0.0

  tenant: # 多租户相关配置项
    enable: false
    ignore-urls:
      - /admin-api/auth/login # 租户登录接口
#      - /admin-api/tenant/get-by-website # 基于域名获取租户，不许带租户编号
#      - /admin-api/dept/*
#      - /admin-api/config/**

  security:
    permit-all-urls:
      - /admin-api/auth/login # 租户登录接口
      - /admin-api/captcha/get
      - /admin-api/captcha/check
      - /admin-api/tenant/create
      - /admin-api/user/create

  logging:
    loki:
      # 本机 Loki 推送地址。校验方式：curl http://127.0.0.1:31920/ready 应返回 200
      # 30310 端口虽然也监听，但返回 302（网关重定向），推过去必然失败
      url: http://127.0.0.1:31920/loki/api/v1/push
      # LOKI = 开启推送；LOKI_NOP = 关闭推送。
      # Loki 没启动时务必切成 LOKI_NOP：启动瞬间推送失败会被 LogbackLoggingSystem
      # 判定为”配置错误“并中断启动（运行期推送失败不会致命）
      appender: LOKI



